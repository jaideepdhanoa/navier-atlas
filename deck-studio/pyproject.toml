[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navier-deck-studio"
version = "0.1.0"
description = "Portable Grok-run deck creation, editing, image compositing, and QA workflow for Navier decks."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22.0",
  "Pillow>=10.3.0",
  "google-api-python-client>=2.130.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  "python-dotenv>=1.0.1"
]

[project.scripts]
deck-studio = "deck_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "builders"}

[tool.setuptools.packages.find]
where = ["builders"]
